name: Release DMG

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-release:
    runs-on: macos-14
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Run unit tests
        run: swift test

      - name: Build CleanPaste.dmg
        run: |
          chmod +x scripts/build_app.sh scripts/build_dmg.sh
          ./scripts/build_dmg.sh

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: CleanPaste-dmg
          path: |
            build/CleanPaste.dmg
            build/CleanPaste.dmg.sha256

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            build/CleanPaste.dmg
            build/CleanPaste.dmg.sha256
          body: |
            ### Installation
            1. Download **`CleanPaste.dmg`**, open it, and drag **CleanPaste.app** into **Applications**.
            2. Because this open-source build is ad-hoc signed without paid Apple notarization, remove the macOS quarantine flag before first launch:
               ```zsh
               xattr -cr /Applications/CleanPaste.app
               open /Applications/CleanPaste.app
               ```
            3. Grant Accessibility permission in **System Settings → Privacy & Security → Accessibility** to enable Direct Paste (`⌘V`) and Paste Stack auto-advance.
